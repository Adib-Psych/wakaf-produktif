name: Entry recovery regression
on:
  pull_request:
  push:
    branches: [fix/entry-recovery-t6f78fa93]
permissions:
  contents: read
jobs:
  entry-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline source regressions
        run: node --test tests/*.test.cjs operations/tests/*.test.cjs
      - name: Payroll contract and coherent reader regressions
        run: node --test recovery/payroll-*.test.mjs recovery/payroll-reader-behavior.test.cjs
      - name: Install isolated emulator test dependencies
        working-directory: recovery
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify containment candidate (demo project only)
        working-directory: recovery
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm run test:rules
      - name: Install staged wage processor dependencies (no deploy)
        working-directory: wage-backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Staged wage processor regressions (demo Firestore only)
        working-directory: wage-backend
        env:
          TMPDIR: ${{ runner.temp }}
        run: ../recovery/node_modules/.bin/firebase emulators:exec --only firestore --project demo-wakaf-wages --config firebase.test.json 'node --test test/*.test.cjs'
      - name: Payroll capability rules (demo project only)
        env:
          TMPDIR: ${{ runner.temp }}
        run: node recovery/payroll.rules.test.cjs
      - name: Payroll transactional client (demo project only)
        env:
          TMPDIR: ${{ runner.temp }}
        run: node recovery/payroll-client-run.cjs


      - name: Public-read and Google-write rules (demo project only)
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/rules-public-run.cjs
      - name: Isolated browser smoke (production network blocked)
        run: |
          recovery/node_modules/.bin/playwright install --with-deps chromium
          CHROME_PATH=$(node tests/browser-path.cjs) node tests/browser-held-release.cjs
          CHROME_PATH=$(node tests/browser-path.cjs) node tests/browser-worker-upgrade.cjs
          CHROME_PATH=$(node tests/browser-path.cjs) node --test tests/account-session-runtime.browser.cjs
